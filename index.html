<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tugas Pertemuan 5</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Sistem Penilaian & Evaluasi Akademik</h1>
            <p class="subtitle">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Accusamus accusantium voluptas reprehenderit.
            </p>
            <div class="card">
                <h2>Predikat Nilai Mahasiswa</h2>
                <div class="input-group">
                    <label for="scoreInput">Masukkan nilai Angka (1-100)</label>
                    <input type="number" id="scoreInput" min="0" max="100" placeholder="Contoh : 85">
                    <button id="checkBtn">Proses Nilai</button>
                </div>
                <div class="result-box hidden" id="resultBox">
                    <p id="gradeResult"></p>
                    <p id="msgResult"></p>
                </div>
            </div>

            <!--Bagian Simulasi Daftar Nilai-->
            <div class="card">
                <h2>Simulasi Rekapitulasi data perulangan </h2>
                <button id="generateBtn">Tampilkan daftar nilai kelas</button>
                <div class="table-responsive">
                    <table id="scoreTable" class="hidden">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Mahasiswa</th>
                                    <th>Nilai Ujian</th>
                                    <th>Predikat</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
